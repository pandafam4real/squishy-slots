<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yum Sum Squishies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#0d0d1a;--pink:#ff6b9d;--mint:#5dd9c1;--lav:#b4a0ff;
--butter:#ffe066;--gold:#ffd700;--peach:#ffb347;
}
html,body{
  min-height:100vh;
  background:var(--bg);
  background-image:
    radial-gradient(ellipse at 20% 0%, rgba(107,91,204,0.18) 0%, transparent 55%),
    radial-gradient(ellipse at 80% 100%, rgba(255,107,157,0.12) 0%, transparent 55%),
    radial-gradient(ellipse at 50% 50%, rgba(30,30,60,0.9) 0%, transparent 100%);
  font-family:'Nunito',sans-serif;color:#fff;overflow-x:hidden
}
body{display:flex;flex-direction:column;align-items:center;padding:20px 8px 100px}

/* HEADER */
.header{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:420px;margin-bottom:20px}
.coin-wrap{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#1a1a3a,#252550);border-radius:24px;padding:10px 20px;box-shadow:0 4px 20px rgba(0,0,0,0.5);border:1px solid rgba(255,215,0,0.2)}
.coin-icon{width:36px;height:36px;background:linear-gradient(145deg,#fff0a0,#ffd700,#b8860b);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:#7a4a00;box-shadow:0 2px 8px rgba(255,215,0,0.5),inset 0 2px 4px rgba(255,255,255,0.4)}
#coinBalance{font-size:26px;font-weight:900;transition:transform 0.2s}
#coinBalance.pop{animation:pop 0.3s}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.35)}100%{transform:scale(1)}}
.streak-badge{display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,#1a1a3a,#252550);border-radius:24px;padding:10px 16px;box-shadow:0 4px 20px rgba(0,0,0,0.5);border:1px solid rgba(255,159,79,0.2)}
.streak-badge svg{width:24px;height:24px}
#streakText{font-size:14px;font-weight:800;color:var(--peach)}

/* MACHINE */
.machine-container{perspective:1200px;width:100%;max-width:420px}
.machine{
  background:linear-gradient(160deg,#2a2a5a 0%,#1e1e3a 40%,#181830 100%);
  border-radius:32px;padding:24px 16px 20px;width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,0.7),0 0 0 1px rgba(255,255,255,0.06),inset 0 1px 0 rgba(255,255,255,0.1),inset 0 -2px 0 rgba(0,0,0,0.3);
  transform:rotateX(3deg);transform-style:preserve-3d;position:relative;
}
.machine::before{content:'';position:absolute;top:0;left:10%;right:10%;height:3px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.15),rgba(255,255,255,0.3),rgba(255,255,255,0.15),transparent);border-radius:0 0 3px 3px}

.machine-title{text-align:center;font-size:20px;font-weight:900;letter-spacing:3px;margin-bottom:14px;background:linear-gradient(135deg,#ffd700 0%,#ff9f1c 30%,#ff6b9d 60%,#b4a0ff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 6px rgba(255,107,157,0.5))}

/* 3D SLOT GRID */
.slot-grid-wrap{background:linear-gradient(180deg,#080810 0%,#0d0d1a 100%);border-radius:24px;padding:10px;border:3px solid #222;box-shadow:inset 0 6px 24px rgba(0,0,0,0.95),0 0 0 1px rgba(0,0,0,0.4)}
.slot-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.slot-cell{
  aspect-ratio:1;background:linear-gradient(145deg,#141428,#0c0c1e);border-radius:16px;
  display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;
  border:2px solid #1e1e3a;
  box-shadow:inset 0 3px 8px rgba(0,0,0,0.8),inset 0 0 0 1px rgba(255,255,255,0.02),0 2px 0 rgba(255,255,255,0.03);
}
/* Jellycat glass sheen */
.slot-cell::after{content:'';position:absolute;inset:0;border-radius:14px;background:linear-gradient(145deg,rgba(255,255,255,0.09) 0%,transparent 40%,rgba(255,255,255,0.04) 100%);pointer-events:none}
.slot-cell svg{width:88%;height:88%;filter:drop-shadow(0 4px 10px rgba(0,0,0,0.8))}
.slot-cell.winner{border-color:var(--gold);box-shadow:inset 0 3px 8px rgba(0,0,0,0.6),0 0 28px rgba(255,215,0,0.75),0 0 56px rgba(255,215,0,0.35);animation:winBounce3d 0.5s ease-in-out infinite alternate}
@keyframes winBounce3d{from{transform:scale(1) translateY(0)}to{transform:scale(1.08) translateY(-4px)}}
.slot-cell.nearmiss{border-color:var(--peach);animation:shake3d 0.4s ease;box-shadow:inset 0 3px 8px rgba(0,0,0,0.6),0 0 18px rgba(255,179,71,0.5)}
@keyframes shake3d{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px) rotate(-2deg)}40%{transform:translateX(5px) rotate(2deg)}60%{transform:translateX(-3px) rotate(-1deg)}80%{transform:translateX(3px) rotate(1deg)}}

.paytable{margin-top:14px;font-size:10px;color:#777;text-align:center;line-height:1.9}
.paytable span{color:var(--butter);font-weight:800}

/* SPIN BUTTON */
.spin-wrap{text-align:center;margin-top:18px;perspective:500px}
#spinBtn{
  width:92%;max-width:340px;height:76px;border:none;border-radius:38px;
  background:linear-gradient(160deg,#ff85ad 0%,#ff6b9d 30%,#d44a80 70%,#b33d6a 100%);
  color:#fff;font-family:'Nunito',sans-serif;font-size:26px;font-weight:900;letter-spacing:3px;cursor:pointer;position:relative;
  box-shadow:0 8px 0 #8a2250,0 12px 24px rgba(212,74,128,0.5),inset 0 2px 0 rgba(255,255,255,0.25),inset 0 -2px 0 rgba(0,0,0,0.15);
  transform:translateY(0);transition:transform 0.08s,box-shadow 0.08s;text-shadow:0 2px 4px rgba(0,0,0,0.3);overflow:hidden;
}
#spinBtn::before{content:'';position:absolute;top:4px;left:15%;right:15%;height:40%;background:linear-gradient(180deg,rgba(255,255,255,0.28),transparent);border-radius:50% 50% 40% 40%;pointer-events:none}
#spinBtn:hover{transform:translateY(-3px);box-shadow:0 11px 0 #8a2250,0 16px 32px rgba(212,74,128,0.65),inset 0 2px 0 rgba(255,255,255,0.3),inset 0 -2px 0 rgba(0,0,0,0.15)}
#spinBtn:active,#spinBtn.pressed{transform:translateY(6px);box-shadow:0 2px 0 #8a2250,0 4px 12px rgba(212,74,128,0.4),inset 0 2px 0 rgba(255,255,255,0.1),inset 0 -1px 0 rgba(0,0,0,0.2)}
#spinBtn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
#spinBtn.pulse{animation:pulse3d 2s ease-in-out infinite}
@keyframes pulse3d{0%,100%{box-shadow:0 8px 0 #8a2250,0 12px 24px rgba(212,74,128,0.5),inset 0 2px 0 rgba(255,255,255,0.25),inset 0 -2px 0 rgba(0,0,0,0.15)}50%{box-shadow:0 8px 0 #8a2250,0 12px 44px rgba(255,107,157,0.85),inset 0 2px 0 rgba(255,255,255,0.25),inset 0 -2px 0 rgba(0,0,0,0.15)}}
#spinBtn.free-spin{background:linear-gradient(160deg,#7ee8d9 0%,#5dd9c1 30%,#2a9d8f 70%,#1e7a6d 100%);box-shadow:0 8px 0 #1a5c4c,0 12px 24px rgba(45,180,155,0.4),inset 0 2px 0 rgba(255,255,255,0.3),inset 0 -2px 0 rgba(0,0,0,0.15)}
#spinBtn.free-spin::before{background:linear-gradient(180deg,rgba(255,255,255,0.35),transparent)}
.spin-cost{display:block;font-size:12px;font-weight:700;margin-top:2px;opacity:0.85;letter-spacing:1px}

/* STATUS */
.status-area{min-height:52px;display:flex;align-items:center;justify-content:center;margin-top:14px}
#statusMsg{font-size:22px;font-weight:900;text-align:center;transition:opacity 0.3s;letter-spacing:1px}
.win-text{color:var(--gold)!important;text-shadow:0 0 20px var(--gold),0 0 40px rgba(255,215,0,0.5)}
.nearmiss-text{color:var(--peach)!important;text-shadow:0 0 15px rgba(255,179,71,0.6)}
.jackpot-text{color:var(--gold)!important;font-size:30px!important;text-shadow:0 0 30px var(--gold),0 0 60px rgba(255,215,0,0.8);animation:jackpotGlow 0.4s ease-in-out infinite alternate}
@keyframes jackpotGlow{from{text-shadow:0 0 20px var(--gold),0 0 40px rgba(255,215,0,0.4)}to{text-shadow:0 0 40px var(--gold),0 0 80px rgba(255,215,0,0.8),0 0 120px rgba(255,159,71,0.4)}}

/* FOOTER */
.footer{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(to top,rgba(13,13,26,0.98) 60%,transparent);padding:20px 16px 28px;display:flex;flex-direction:column;align-items:center;gap:10px;backdrop-filter:blur(10px)}
.timer-row{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:#888}
.timer-row svg{width:18px;height:18px}
.free-timer{color:var(--mint)}
.collection-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:440px}
.col-item{width:40px;height:40px;background:linear-gradient(145deg,#1e1e3a,#141428);border-radius:10px;display:flex;align-items:center;justify-content:center;border:2px solid #2a2a4a;transition:all 0.3s;box-shadow:inset 0 1px 3px rgba(0,0,0,0.4)}
.col-item.collected{border-color:var(--lav);box-shadow:inset 0 1px 3px rgba(0,0,0,0.4),0 0 10px rgba(180,160,255,0.3)}
.col-item svg{width:28px;height:28px;opacity:0.12;transition:opacity 0.3s}
.col-item.collected svg{opacity:1}
.collect-progress{font-size:12px;font-weight:800;color:var(--lav)}
.btn-row{display:flex;gap:10px}
.footer-btn{padding:10px 22px;border:none;border-radius:22px;cursor:pointer;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;transition:transform 0.1s,box-shadow 0.1s}
.footer-btn:hover{transform:translateY(-2px)}
.share-btn{background:linear-gradient(135deg,#7ee8d9,#5dd9c1);color:#0d2e28;box-shadow:0 4px 12px rgba(93,217,193,0.3)}
.lead-btn{background:linear-gradient(135deg,#c4a8ff,#9b7ce8);color:#fff;box-shadow:0 4px 12px rgba(155,124,232,0.3)}

/* OVERLAYS */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.88);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity 0.3s;backdrop-filter:blur(8px)}
.overlay.active{opacity:1;pointer-events:all}
.modal{background:linear-gradient(160deg,#2a2a5a,#1e1e3a);border-radius:28px;padding:32px 24px;max-width:360px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.8),inset 0 1px 0 rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.08)}
.modal h2{font-size:24px;font-weight:900;margin-bottom:16px;background:linear-gradient(135deg,#ff9f1c,#ff6b9d,#b4a0ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.modal p{font-size:14px;color:#aaa;line-height:1.7;margin-bottom:16px}
.modal-close{background:linear-gradient(160deg,#ff85ad,#ff6b9d);color:#fff;border:none;padding:14px 36px;border-radius:28px;font-family:'Nunito',sans-serif;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 #b33d6a,0 6px 16px rgba(255,107,157,0.4);transition:transform 0.1s,box-shadow 0.1s}
.modal-close:hover{transform:translateY(-2px);box-shadow:0 6px 0 #b33d6a,0 8px 20px rgba(255,107,157,0.5)}
.modal-close:active{transform:translateY(3px);box-shadow:0 1px 0 #b33d6a}
.leader-list{list-style:none;text-align:left;margin:16px 0}
.leader-list li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.06);font-size:14px;font-weight:700}
.leader-rank{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex-shrink:0}
.leader-rank.r1{background:linear-gradient(135deg,#ffd700,#ff9f1c);color:#7a4a00}
.leader-rank.r2{background:linear-gradient(135deg,#e0e0e0,#a0a0a0);color:#333}
.leader-rank.r3{background:linear-gradient(135deg,#cd7f32,#a0522d);color:#fff}
.leader-bal{color:var(--butter);margin-left:auto;font-weight:800}

/* EFFECTS */
.coin-rain{position:fixed;top:-40px;pointer-events:none;z-index:200;font-size:30px;animation:coinFall3d 1.8s ease-in forwards;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.5))}
@keyframes coinFall3d{0%{transform:translateY(0) rotate(0deg) scale(1);opacity:1}80%{opacity:1}100%{transform:translateY(110vh) rotate(720deg) scale(0.8);opacity:0}}
.jackpot-flash{position:fixed;inset:0;background:radial-gradient(circle,rgba(255,215,0,0.7),rgba(255,107,157,0.3),transparent 70%);z-index:150;opacity:0;pointer-events:none;animation:flashIn3d 1.2s forwards}
@keyframes flashIn3d{0%{opacity:1}100%{opacity:0}}
.confetti-piece{position:fixed;border-radius:3px;z-index:160;animation:confettiFall3d 2.5s ease-in forwards;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.4))}
@keyframes confettiFall3d{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(1080deg) scale(0.6);opacity:0}}
.slot-cell.spinning svg{animation:spinCycle3d 0.12s linear infinite;filter:drop-shadow(0 0 10px rgba(255,255,255,0.3))}
@keyframes spinCycle3d{0%{transform:translateY(-100%) scale(0.88);opacity:0.4}50%{transform:translateY(0) scale(1.06);opacity:1}100%{transform:translateY(100%) scale(0.88);opacity:0.4}}
.nearmiss-float{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:13px;font-weight:900;color:var(--peach);animation:floatUp3d 0.9s ease-out forwards;white-space:nowrap;z-index:10;text-shadow:0 0 10px rgba(255,179,71,0.8)}
@keyframes floatUp3d{0%{opacity:1;top:-14px;transform:translateX(-50%) scale(0.8)}50%{opacity:1;transform:translateX(-50%) scale(1.1)}100%{opacity:0;top:-50px;transform:translateX(-50%) scale(0.9)}}

@media(max-width:380px){.machine-title{font-size:17px}#spinBtn{font-size:22px;height:64px}.col-item{width:34px;height:34px}.col-item svg{width:22px;height:22px}#coinBalance{font-size:22px}}
</style>
</head>
<body>

<div class="header">
  <div class="coin-wrap"><div class="coin-icon">$</div><span id="coinBalance">1,000</span></div>
  <div class="streak-badge">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 2C8 6 6 10 8 14c1 2 3 3 4 4 1-1 3-2 4-4 2-4 0-8-4-12z" fill="#ff9f1c"/><path d="M12 8c-2 2.5-3.5 5-2.5 7.5.5 1.25 1.5 2 2.5 2.5.5-.5 1.5-1.25 2.5-2.5 1-2.5-.5-5-2.5-7.5z" fill="#ffd700"/></svg>
    <span id="streakText">Day 1</span>
  </div>
</div>

<div class="machine-container">
  <div class="machine">
    <div class="machine-title">YUM SUM SQUISHIES</div>
    <div class="slot-grid-wrap"><div class="slot-grid" id="slotGrid"></div></div>
    <div class="paytable">
      <span>3 Match = 50</span> &nbsp;|&nbsp; <span>4 Match = 200</span> &nbsp;|&nbsp; <span>5 Match = 500</span><br>
      <span>JACKPOT (3x Golden) = 5000</span> &nbsp;|&nbsp; <span>Near Miss = 3–5 coins</span>
    </div>
  </div>
</div>

<div class="spin-wrap">
  <button id="spinBtn" class="pulse" onclick="doSpin()">SQUEEZE!<span class="spin-cost">10 coins</span></button>
</div>

<div class="status-area"><div id="statusMsg"></div></div>

<div class="footer">
  <div class="timer-row">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
    <span class="free-timer" id="freeTimerLabel">Free spin in </span>
    <span class="free-timer" id="freeTimer">–:––:––</span>
  </div>
  <div class="collection-row" id="collectionRow"></div>
  <div class="collect-progress" id="collectProgress">0/6 Collected</div>
  <div class="btn-row">
    <button class="footer-btn share-btn" onclick="shareScore()">Share</button>
    <button class="footer-btn lead-btn" onclick="showLeaderboard()">Top Scores</button>
  </div>
</div>

<div class="overlay" id="jackpotOverlay"><div class="modal"><h2>JACKPOT!!!</h2><p id="jackpotMsg">You won 5,000 coins!</p><button class="modal-close" onclick="closeJackpot()">AMAZING!</button></div></div>
<div class="overlay" id="bonusOverlay"><div class="modal"><h2>Bonus Round!</h2><p>You collected all 6 Squishies! 3 FREE SPINS!</p><button class="modal-close" onclick="closeBonus()">LET'S GO!</button></div></div>
<div class="overlay" id="leaderOverlay"><div class="modal"><h2>Top Scores</h2><ul class="leader-list" id="leaderList"></ul><p id="currentBalance"></p><button class="modal-close" onclick="closeLeaderboard()">Close</button></div></div>

<script>
// ================================================================
// YUM SUM SQUISHIES — Jellycat × Dim Sum
// Material system: SSS gel bodies, corduroy boots, beaded safety eyes,
// embroidered smiles, ribbed textures, soft pastel gradients
// ================================================================

// ── Jellycat eye factory (beaded plastic safety eye) ──────────
function eye(cx, cy, r) {
  return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#111"/>
  <circle cx="${cx-r*0.3}" cy="${cy-r*0.3}" r="${r*0.45}" fill="rgba(255,255,255,0.9)"/>
  <circle cx="${cx-r*0.55}" cy="${cy-r*0.55}" r="${r*0.18}" fill="rgba(255,255,255,0.6)"/>`;
}

// ── Embroidered smile ──────────────────────────────────────
function smile(x, y, w) {
  return `<path d="M${x} ${y} Q${x+w*0.5} ${y+w*0.38} ${x+w} ${y}" stroke="#1a0a00" stroke-width="1.8" fill="none" stroke-linecap="round"/>`;
}

// ── Blush cheeks ─────────────────────────────────────────────
function blush(cx, cy) {
  return `<ellipse cx="${cx-7}" cy="${cy}" rx="5.5" ry="3.5" fill="rgba(255,130,148,0.45)"/>
  <ellipse cx="${cx+7}" cy="${cy}" rx="5.5" ry="3.5" fill="rgba(255,130,148,0.45)"/>`;
}

// ── Corduroy boots ────────────────────────────────────────────
function boots(x, y, color) {
  let s = `<rect x="${x}" y="${y}" width="8" height="13" rx="4" fill="${color}"/>`;
  for(let i=0;i<3;i++){
    const lx = x + 2 + i*2.2;
    s += `<line x1="${lx}" y1="${y+1}" x2="${lx}" y2="${y+12}" stroke="rgba(0,0,0,0.18)" stroke-width="0.8"/>`;
  }
  return s;
}

// ── SSS Gel base ───────────────────────────────────────────────
// Returns SVG ellipse for SSS underglow
function sssUnderglow(SSSColor, opacity) {
  return `<ellipse cx="32" cy="54" rx="18" ry="7" fill="${SSSColor}" opacity="${opacity}" style="mix-blend-mode:multiply"/>`;
}

// ── SSS shine overlay ─────────────────────────────────────────
function sssShine() {
  return `<ellipse cx="24" cy="26" rx="9" ry="7" fill="rgba(255,255,255,0.72)"/>`;
}

// ── Slot symbols ───────────────────────────────────────────────
const SYMBOLS = {

  // ── BAO-BAO — Common ─────────────────────────────────────
  // XL Soupy Xiaolongbao — translucent maltose gel, pinched pleats,
  // blush pink gradient, dangling corduroy boots
  baobao: {
    svg: `<svg viewBox="0 0 64 64">
  <defs>
    <radialGradient id="baoSSS" cx="38%" cy="32%" r="62%">
      <stop offset="0%" stop-color="#fff8f2"/>
      <stop offset="35%" stop-color="#fce4d6"/>
      <stop offset="70%" stop-color="#f5c8a8"/>
      <stop offset="100%" stop-color="#c88860"/>
    </radialGradient>
    <radialGradient id="baoInner" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,200,100,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,180,80,0)"/>
    </radialGradient>
    <filter id="baoShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="1" dy="4" stdDeviation="4" flood-color="rgba(180,100,50,0.38)"/>
    </filter>
    <filter id="baoGel">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="baoPleat" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(200,140,90,0.45)"/>
      <stop offset="50%" stop-color="rgba(255,220,190,0.3)"/>
      <stop offset="100%" stop-color="rgba(200,140,90,0.45)"/>
    </linearGradient>
  </defs>

  <!-- SSS soup glow from inside -->
  <ellipse cx="32" cy="44" rx="13" ry="9" fill="url(#baoInner)" filter="url(#baoGel)"/>

  <!-- Main bun body — SSS maltose gel -->
  <ellipse cx="32" cy="36" rx="22" ry="22" fill="url(#baoSSS)" filter="url(#baoShadow)"/>

  <!-- Gel overlay gloss -->
  <ellipse cx="32" cy="33" rx="17" ry="15" fill="rgba(255,248,242,0.28)"/>

  <!-- Pinched pleat lines at top -->
  <path d="M24 17 Q26 22 28 17 Q30 22 32 17 Q34 22 36 17 Q38 22 40 17" stroke="url(#baoPleat)" stroke-width="1.6" fill="none" stroke-linecap="round"/>

  <!-- SSS shine -->
  ${sssShine()}

  <!-- Beady safety eyes -->
  ${eye(24, 34, 4.5)}

// ── AUDIO ──────────────────────────────────────────────────────
let audioCtx = null;
function getAudio(){if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); return audioCtx;}
function playTone(freq,type,dur,vol=0.3,startTime=0){
  const ctx=getAudio(), osc=ctx.createOscillator(), gain=ctx.createGain();
  osc.connect(gain); gain.connect(ctx.destination);
  osc.type=type; osc.frequency.value=freq;
  const t=ctx.currentTime+startTime;
  gain.gain.setValueAtTime(0,t);
  gain.gain.linearRampToValueAtTime(vol,t+0.01);
  gain.gain.exponentialRampToValueAtTime(0.001,t+dur);
  osc.start(t); osc.stop(t+dur+0.05);
}
function playNoise(dur,vol=0.15,startTime=0){
  const ctx=getAudio(), buf=ctx.createBuffer(1,ctx.sampleRate*dur,ctx.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  const src=ctx.createBufferSource(), gain=ctx.createGain(), filter=ctx.createBiquadFilter();
  filter.type='highpass'; filter.frequency.value=1000;
  src.buffer=buf; src.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
  const t=ctx.currentTime+startTime;
  gain.gain.setValueAtTime(0,t);
  gain.gain.linearRampToValueAtTime(vol,t+0.01);
  gain.gain.exponentialRampToValueAtTime(0.001,t+dur);
  src.start(t); src.stop(t+dur);
}
function soundWhoosh(){playNoise(0.3,0.2); playTone(400,'sine',0.3,0.1)}
function soundTick(){const ctx=getAudio(), buf=ctx.createBuffer(1,ctx.sampleRate*0.03,ctx.sampleRate), d=buf.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(d.length*0.3)); const src=ctx.createBufferSource(); src.buffer=buf; const g=ctx.createGain(); g.gain.value=0.12; src.connect(g); g.connect(ctx.destination); src.start();}
function soundThud(){playTone(80,'sine',0.15,0.4); playTone(60,'sine',0.1,0.2)}
function soundCoin(){for(let i=0;i<6;i++) setTimeout(()=>playTone(800+i*200,'sine',0.1,0.2),i*60);}
function soundJackpot(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>playTone(f,'sine',0.4,0.3),i*150)); setTimeout(()=>[1047,1319,1568,2093].forEach((f,i)=>setTimeout(()=>playTone(f,'square',0.3,0.15),i*100)),600);}
function soundNearMiss(){playTone(200,'sine',0.3,0.2); setTimeout(()=>playTone(180,'sine',0.4,0.15),200);}

let state = {balance:1000,freeSpinReady:false,bonusSpins:0,spinning:false,collection:{},dailyStreak:1,biggestWin:0};
const COL_CELLS=[[0,5,10,15,20],[1,6,11,16,21],[2,7,12,17,22],[3,8,13,18,23],[4,9,14,19,24]];

function loadState(){
  state.balance=parseInt(localStorage.getItem(STORAGE_KEYS.balance))||1000;
  state.biggestWin=parseInt(localStorage.getItem(STORAGE_KEYS.biggestWin))||0;
  const lastVisit=localStorage.getItem(STORAGE_KEYS.lastVisit);
  const now=new Date();
  if(lastVisit){const gap=(now-new Date(lastVisit))/1000/3600; if(gap>=24)state.dailyStreak=1; else if(gap>=1)state.dailyStreak=parseInt(localStorage.getItem(STORAGE_KEYS.streak))||1;}
  state.collection=JSON.parse(localStorage.getItem(STORAGE_KEYS.collection)||'{}');
  const lastSpin=localStorage.getItem(STORAGE_KEYS.lastSpin);
  if(lastSpin){const elapsed=(now-new Date(lastSpin))/1000; state.freeSpinReady=elapsed>=14400;} else state.freeSpinReady=true;
}
function saveBalance(){localStorage.setItem(STORAGE_KEYS.balance,state.balance)}
function saveCollection(){localStorage.setItem(STORAGE_KEYS.collection,JSON.stringify(state.collection))}
function saveStreak(){localStorage.setItem(STORAGE_KEYS.streak,state.dailyStreak); localStorage.setItem(STORAGE_KEYS.lastVisit,new Date().toISOString())}
function saveLastSpin(){localStorage.setItem(STORAGE_KEYS.lastSpin,new Date().toISOString())}
function saveBiggestWin(){localStorage.setItem(STORAGE_KEYS.biggestWin,state.biggestWin)}
function updateLeaderboard(score){let lb=JSON.parse(localStorage.getItem(STORAGE_KEYS.leaderboard)||'[]'); lb.push({score,date:new Date().toLocaleDateString()}); lb.sort((a,b)=>b.score-a.score); localStorage.setItem(STORAGE_KEYS.leaderboard,JSON.stringify(lb.slice(0,20)));}

function buildCollection(){
  const row=document.getElementById('collectionRow'); row.innerHTML='';
  SYMBOL_KEYS.forEach(key=>{const div=document.createElement('div'); div.className='col-item'+(state.collection[key]?' collected':''); div.id='col-'+key; div.innerHTML=SYMBOLS[key].svg; div.title=`${SYMBOLS[key].name} — ${SYMBOLS[key].type}`; row.appendChild(div);});
  const total=SYMBOL_KEYS.filter(k=>state.collection[k]).length;
  document.getElementById('collectProgress').textContent=`${total}/${SYMBOL_KEYS.length} Collected`;
  if(total===SYMBOL_KEYS.length && !localStorage.getItem(STORAGE_KEYS.bonusUsed)){setTimeout(()=>showBonus(),500);}
}
function updateBalanceUI(animate=true){const el=document.getElementById('coinBalance'); el.textContent=state.balance.toLocaleString(); if(animate){el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');}}
function updateStreakUI(){document.getElementById('streakText').textContent='Day '+state.dailyStreak}
function updateSpinButton(){
  const btn=document.getElementById('spinBtn');
  if(state.bonusSpins>0){btn.classList.add('free-spin'); btn.querySelector('.spin-cost').textContent=`FREE (${state.bonusSpins})`;}
  else if(state.freeSpinReady){btn.classList.add('free-spin'); btn.querySelector('.spin-cost').textContent='FREE SPIN!';}
  else{btn.classList.remove('free-spin'); btn.querySelector('.spin-cost').textContent='10 coins';}
}

// ── SLOT LOGIC ────────────────────────────────────────────────
function pickSymbol(){let r=Math.random()*TOTAL_WEIGHT; for(const key of SYMBOL_KEYS){r-=RARITY_WEIGHTS[key]; if(r<=0)return key;} return SYMBOL_KEYS[0];}
function lineCellIndices(lineIdx,posInLine){if(lineIdx<5)return lineIdx*5+posInLine; else if(lineIdx<10)return COL_CELLS[lineIdx-5][posInLine]; else if(lineIdx===10)return posInLine*6; else return 4+posInLine*4;}

function generateResult(){
  const pool=[]; SYMBOL_KEYS.forEach(k=>{for(let i=0;i<RARITY_WEIGHTS[k];i++)pool.push(k);});
  const pick=()=>pool[Math.floor(Math.random()*pool.length)];
  const grid=Array.from({length:25},()=>pick());
  const lines=[];
  for(let r=0;r<5;r++)lines.push([grid[r*5],grid[r*5+1],grid[r*5+2],grid[r*5+3],grid[r*5+4]]);
  for(let c=0;c<5;c++)lines.push([grid[c],grid[5+c],grid[10+c],grid[15+c],grid[20+c]]);
  lines.push([grid[0],grid[6],grid[12],grid[18],grid[24]]);
  lines.push([grid[4],grid[8],grid[12],grid[16],grid[20]]);
  const lineMatches=lines.map((line,li)=>{const symCount={}; line.forEach(s=>symCount[s]=(symCount[s]||0)+1); let bestKey=null,bestCount=0,bestPos=[]; Object.entries(symCount).forEach(([k,v])=>{if(v>bestCount){bestCount=v;bestKey=k;}}); if(bestCount>=3){line.forEach((s,pi)=>{if(s===bestKey)bestPos.push(pi);});} return {key:bestKey,count:bestCount,positions:bestPos};});
  let totalWin=0,winningCells=new Set(),jackpot=false,nearMiss=false;
  lineMatches.forEach((lm,li)=>{if(lm.count>=3){const payTable={3:50,4:200,5:500}; let win=payTable[lm.count]||50; if(lm.key==='jin'&&lm.count>=3){win=5000;jackpot=true;} totalWin+=win; lm.positions.forEach(pos=>winningCells.add(lineCellIndices(li,pos)));}});
  if(!jackpot&&totalWin===0){lineMatches.forEach((lm,li)=>{if(lm.count===2){nearMiss=true; lm.positions.forEach(pos=>winningCells.add(lineCellIndices(li,pos)));}}); if(nearMiss)totalWin=3+Math.floor(Math.random()*3);}
  if(totalWin===0&&Math.random()<0.7)totalWin=5+Math.floor(Math.random()*10);
  return {grid,totalWin,winningCells:Array.from(winningCells),jackpot,nearMiss};
}

// ── SPIN ──────────────────────────────────────────────────────
async function doSpin(){
  if(state.spinning) return;
  soundClick();
  const isFreeSpin=state.bonusSpins>0||state.freeSpinReady;
  if(!isFreeSpin&&state.balance<10){setStatus('Not enough coins!','nearmiss-text'); return;}
  if(!isFreeSpin){state.balance-=10;saveLastSpin();} else {state.bonusSpins=Math.max(0,state.bonusSpins-1); if(state.bonusSpins===0&&state.freeSpinReady)state.freeSpinReady=false;}
  state.spinning=true;
  const btn=document.getElementById('spinBtn');
  btn.disabled=true; btn.classList.remove('pulse'); btn.classList.add('pressed');
  setTimeout(()=>btn.classList.remove('pressed'),100);
  updateBalanceUI(); updateSpinButton();
  const result=generateResult();
  const colStopTimes=[700,1000,1300,1600,1900];
  soundWhoosh();
  let tickInterval=setInterval(soundTick,60);
  for(let i=0;i<25;i++)document.getElementById('cell'+i).classList.add('spinning');
  for(let col=0;col<5;col++){
    await new Promise(res=>setTimeout(res,col===0?colStopTimes[0]:colStopTimes[col]-colStopTimes[col-1]));
    COL_CELLS[col].forEach(cellIdx=>{const el=document.getElementById('cell'+cellIdx); el.classList.remove('spinning'); el.innerHTML=SYMBOLS[result.grid[cellIdx]].svg;});
    soundThud();
    COL_CELLS[col].forEach(cellIdx=>{state.collection[result.grid[cellIdx]]=(state.collection[result.grid[cellIdx]]||0)+1;});
  }
  clearInterval(tickInterval);
  await new Promise(res=>setTimeout(res,300));
  result.winningCells.forEach(idx=>{const el=document.getElementById('cell'+idx); if(result.jackpot)el.classList.add('winner'); else if(result.nearMiss){el.classList.add('nearmiss'); const float=document.createElement('div'); float.className='nearmiss-float'; float.textContent=result.totalWin>0?'SO CLOSE!':''; el.appendChild(float); setTimeout(()=>{el.classList.remove('nearmiss');float.remove();},900);}});
  if(result.jackpot){soundJackpot();state.balance+=result.totalWin;if(state.balance>state.biggestWin)state.biggestWin=state.balance;saveBiggestWin();updateBalanceUI();showJackpot(result.totalWin);confetti();flashScreen();}
  else if(result.totalWin>0){if(result.nearMiss){soundNearMiss();setStatus(`+${result.totalWin} coins!`,'nearmiss-text');}else{soundCoin();setStatus(`+${result.totalWin} coins!`,'win-text');}state.balance+=result.totalWin;if(state.balance>state.biggestWin)state.biggestWin=state.balance;saveBiggestWin();updateBalanceUI();coinRain(result.totalWin);}
  else setStatus('No match...','');
  saveBalance();saveCollection();updateLeaderboard(state.balance);buildCollection();
  setTimeout(()=>{for(let i=0;i<25;i++)document.getElementById('cell'+i).classList.remove('winner','nearmiss');state.spinning=false;btn.disabled=false;btn.classList.add('pulse');updateSpinButton();},2200);
  const now=new Date(),lastVisit=localStorage.getItem(STORAGE_KEYS.lastVisit);
  if(lastVisit){const gap=(now-new Date(lastVisit))/1000/3600; if(gap>=1&&gap<24)state.dailyStreak++; else if(gap>=24)state.dailyStreak=1;}
  saveStreak();updateStreakUI();startFreeTimer();
}
function setStatus(msg,cls){const el=document.getElementById('statusMsg');el.className=cls;el.textContent=msg;}

// ── EFFECTS ──────────────────────────────────────────────────
function coinRain(amount){const count=Math.min(amount,30); for(let i=0;i<count;i++){setTimeout(()=>{const el=document.createElement('div');el.className='coin-rain';el.textContent='🪙';el.style.left=(Math.random()*88)+'vw';el.style.animationDuration=(1.5+Math.random())+'s';document.body.appendChild(el);setTimeout(()=>el.remove(),3000);},i*50);}}
function confetti(){const colors=['#ff6b9d','#5dd9c1','#b4a0ff','#ffe066','#7ec8e3','#ff9f1c','#ffd700','#ff85ad']; for(let i=0;i<60;i++){setTimeout(()=>{const el=document.createElement('div');el.className='confetti-piece';el.style.left=(Math.random()*88)+'vw';el.style.top=(Math.random()*30)+'vh';el.style.background=colors[Math.floor(Math.random()*colors.length)];el.style.animationDuration=(2+Math.random()*1.5)+'s';el.style.width=(8+Math.random()*8)+'px';el.style.height=(8+Math.random()*8)+'px';el.style.borderRadius=Math.random()>0.5?'50%':'3px';document.body.appendChild(el);setTimeout(()=>el.remove(),4000);},i*30);}}
function flashScreen(){const el=document.createElement('div');el.className='jackpot-flash';document.body.appendChild(el);setTimeout(()=>el.remove(),1500);}

// ── TIMER ─────────────────────────────────────────────────────
let freeTimerInterval=null;
function startFreeTimer(){if(freeTimerInterval)clearInterval(freeTimerInterval);const tick=()=>{const lastSpin=localStorage.getItem(STORAGE_KEYS.lastSpin);const timerEl=document.getElementById('freeTimer');if(!lastSpin){timerEl.textContent='READY!';state.freeSpinReady=true;updateSpinButton();return;}const remaining=Math.max(0,14400-(new Date()-new Date(lastSpin))/1000);if(remaining<=0){timerEl.textContent='READY!';state.freeSpinReady=true;updateSpinButton();return;}const h=Math.floor(remaining/3600),m=Math.floor((remaining%3600)/60),s=Math.floor(remaining%60);timerEl.textContent=`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;state.freeSpinReady=false;updateSpinButton();};tick();freeTimerInterval=setInterval(tick,1000);}

// ── MODALS ────────────────────────────────────────────────────
function showJackpot(amount){document.getElementById('jackpotMsg').textContent=`You won ${amount.toLocaleString()} coins!`;document.getElementById('jackpotOverlay').classList.add('active');}
function closeJackpot(){document.getElementById('jackpotOverlay').classList.remove('active');}
function showBonus(){document.getElementById('bonusOverlay').classList.add('active');state.bonusSpins=3;localStorage.setItem(STORAGE_KEYS.bonusUsed,'true');updateSpinButton();}
function closeBonus(){document.getElementById('bonusOverlay').classList.remove('active');}
function showLeaderboard(){const lb=JSON.parse(localStorage.getItem(STORAGE_KEYS.leaderboard)||'[]');const top=lb.slice(0,10);const list=document.getElementById('leaderList');list.innerHTML='';if(top.length===0)list.innerHTML='<li style="justify-content:center;color:#888">No scores yet!</li>';top.forEach((entry,i)=>{const li=document.createElement('li');const rankClass=i===0?'r1':i===1?'r2':'r3';li.innerHTML=`<span class="leader-rank ${rankClass}">${i+1}</span><span>${entry.date}</span><span class="leader-bal">${entry.score.toLocaleString()}</span>`;list.appendChild(li);});document.getElementById('currentBalance').textContent=`Balance: ${state.balance.toLocaleString()} coins`;document.getElementById('leaderOverlay').classList.add('active');}
function closeLeaderboard(){document.getElementById('leaderOverlay').classList.remove('active');}
function shareScore(){const msg=`🍜 Hit ${state.biggestWin.toLocaleString()} coins on Yum Sum Squishies! Can you beat me?\n\n👉 pandafam4real.github.io/squishy-slots`;if(navigator.clipboard){navigator.clipboard.writeText(msg).then(()=>{const btn=document.querySelector('.share-btn');const orig=btn.textContent;btn.textContent='Copied!';setTimeout(()=>btn.textContent=orig,2000);});}}

// ── INIT ──────────────────────────────────────────────────────
function init(){
  loadState(); buildGrid(); buildCollection();
  updateBalanceUI(false); updateStreakUI(); updateSpinButton(); startFreeTimer();
  for(let i=0;i<25;i++)document.getElementById('cell'+i).innerHTML=SYMBOLS[pickSymbol()].svg;
}
init();
</script>
</body>
